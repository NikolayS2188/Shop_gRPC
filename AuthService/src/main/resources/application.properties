# Server Configuration
grpc.server.port=9090

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5434/auth_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Connection pool settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=AuthHikariPool

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
# Disable OSIV (Open Session in View) - Spring Boot recommendation:
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==
jwt.access-ttl-minutes=60

# Cost for BCrypt: 2^cost iterations (10 = fast, 12 = balance, 14+ = slow)
bcrypt.cost=12

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.root=INFO
logging.level.com.karkaror.auth=DEBUG
