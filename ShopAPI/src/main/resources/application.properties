# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/shop_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Connection pool settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=ShopHikariPool

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
# Disable OSIV (Open Session in View) - Spring Boot recommendation:
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.root=INFO
logging.level.com.karkaror.shop=DEBUG

# Swagger UI path
springdoc.swagger-ui.path=/swagger/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# gRPC-client Configuration
# Just for consistency and documentation, since manual creating stub - AuthService using @Value("${grpc.client.auth-service.address}").
# This is actually being used in case for auto creating and injecting gRPC-client (stub) - logic name "auth-service" of bin in @GrpcClient (not using in AuthService).
# Fixed address for AuthService (static://, without service discovery or others):
grpc.client.auth-service.address=static://localhost:9090
# A transport-layer security negotiation type that determines how a client establishes a connection with a sever. PLAINTEXT - no encryption, no TLS (for production TLS - is the minimum):
grpc.client.auth-service.negotiationType=PLAINTEXT
# Deadline (ms) for all gRPC-calls. 3000 ms = 3 sec - with reserve for BCrypt + DB. If AuthService does not respond within 3 seconds - DEADLINE_EXCEEDED 503:
shop.grpc.deadline-ms=3000

# File upload size (for images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
