services:
  shop-postgres:
    image: postgres:18
    container_name: shop_db
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # внешний 5433 → внутренний 5432
    volumes:
      - shop_postgres_data:/var/lib/postgresql
    restart: unless-stopped

  auth-postgres:
    image: postgres:18
    container_name: auth_db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"   # внешний 5434 → внутренний 5432
    volumes:
      - auth_postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  shop_postgres_data:
  auth_postgres_data: